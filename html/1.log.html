<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Model Zero login</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/common.css">  
    <link rel="stylesheet" href="../css/style.css">    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="../script/jquery-3.6.0.js"></script>
</head>
<body>
    <!-- 메인 -->
    <div id="main-content">

      <div class="custom-cursor"></div> <!-- 마우스따라다니는 원 -->
      
      <button id="topButton" style="display: none;"><img src="../img/arrow.svg" alt="">Top</button> <!-- 탑버튼 -->

      <!-- header -->
      <header>
        <a href="index.html">
          <div class="logoWrap"><span>Model Zero</span></div>
        </a>
        <div class="menuWrap">
          <button class="hamburger" id="menuToggle">
            <span></span>
            <span></span>
            <span></span>
          </button>
          <div class="sidemenu">
            <ul class="menu">
              <li>
                <a href="../index.html"><p>Home</p></a>
              </li>
              <li>
                <a href="#"><p>상품</p></a>
              </li>
              
              <li>
                <a href="#"><p>매출</p></a>
              </li>
              
              <li>
                <a href="#"><p>기기관리</p></a>
              </li>
              
              <li>
                <a href="#"><p>포인트</p></a>
              </li>
              <li>
                <a href="#"><p>쇼핑몰</p></a>
              </li>
              <li>
                <a href="#"><p>A/S접수</p></a>
              </li>
              <li>
                <a href="#"><p>일반설정</p></a>
              </li>
              <li>
                <a href="#"><p>Zero 멤버스</p></a>
              </li>
            </ul>
          </div>
        </div>
      </header>
    
      <section class="logWrap">
        <div class="section4 boxStyle">
          <h2>Model Zero 관리자 페이지</h2>

          <form>
            <div class="input_box">
              <p>아이디</p>
              <input onfocus="$(this).addClass('focused')" class="input-with-message" type="email"
                  placeholder="Enter username">
          </div>
          <div class="input_box">
              <p>비밀번호</p>
              <div class="password-container">
                  <input id="password" onfocus="$(this).addClass('focused')" class="input-with-message"
                      type="password" placeholder="Enter Password">
                  <div class="eyes"><i class="fa-regular fa-eye"></i></div>
              </div>
          </div>

            <div class="privacy mb30">                  
                <input type="checkbox" id="agree" name="agree">
                <label for="agree">자동로그인</label>
            </div>

            <div class="btnWrap">
              <button type="submit" class="btnStyle mb10">로그인
                <img src="../img/buttom_effect.png" alt="">
                <p>로그인</p>
              </button>
              <button class="btn kakao">
                <img src="../img/kakaoLog.png" alt="">카카오톡 로그인
              </button>
            </div>
          </form>
        </div>
      </section>

    </div>

  </body>
  <script src="../script/common.js"></script>
  <script>
    // Login_password
    function PW_OnOff() {
        $(function () {
            // 눈 표시 클릭 시 패스워드 보이기
            $('.eyes').on('click', function () {
                $(this).toggleClass('active');

                const passwordField = $(this).siblings('#password'); // 비밀번호 입력 필드 선택
                if ($(this).hasClass('active')) {
                    $(this).find('i').attr('class', "fa-regular fa-eye-slash"); // 아이콘 변경
                    passwordField.attr('type', "text"); // 비밀번호 표시
                } else {
                    $(this).find('i').attr('class', "fa-regular fa-eye"); // 아이콘 변경
                    passwordField.attr('type', 'password'); // 비밀번호 숨김
                }
            });
        });
    }
    PW_OnOff();
</script>
</html>
