<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Model Zero_sales</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/common.css">    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="../script/jquery-3.6.0.js"></script>
</head>
<body>
    <!-- 메인 -->
    <div id="main-content">

      <div class="custom-cursor"></div> <!-- 마우스따라다니는 원 -->
      
      <button id="topButton" style="display: none;"><img src="../img/arrow.svg" alt="">Top</button> <!-- 탑버튼 -->

      <!-- header -->
      <header>
        <a href="index.html">
          <div class="logoWrap"><span>Model Zero</span></div>
        </a>
        <div class="menuWrap">
          <button class="hamburger" id="menuToggle">
            <span></span>
            <span></span>
            <span></span>
          </button>
          <!-- <img src="../img/menu.svg" alt=""> -->
          <div class="sidemenu">
            <ul class="menu">
              <li>
                <a href="../index.html"><p>Home</p></a>
              </li>
              <li>
                <a href="#"><p>상품</p></a>
              </li>
              
              <li>
                <a href="#"><p>매출</p></a>
              </li>
              
              <li>
                <a href="#"><p>기기관리</p></a>
              </li>
              
              <li>
                <a href="#"><p>포인트</p></a>
              </li>
              <li>
                <a href="#"><p>쇼핑몰</p></a>
              </li>
              <li>
                <a href="#"><p>A/S접수</p></a>
              </li>
              <li>
                <a href="#"><p>일반설정</p></a>
              </li>
              <li>
                <a href="#"><p>Zero 멤버스</p></a>
              </li>
            </ul>
          </div>
        </div>
      </header>
    
      <section class="mt80">
        <div class="inner boxStyle gr">
          <h2 class="ta-c mb20">매출</h2>
          <!-- 날짜 인풋 2개 + 버튼 -->
          <div class="input-group">
            <div class="day-group">
              <input type="date">
              <span>~</span>
              <input type="date">
            </div>
            <button class="btn-i search"><img src="../img/search.svg" alt=""></button>
            <button class="btn-i reset"><img src="../img/refresh_icon.svg" alt=""></button>
          </div>
        
          <!-- 상세 설정 -->
          <div class="radioBox">
            <div class="details">
              <p>상세 설정</p>
              <div class="radio-group">
                <label><input type="radio" name="detail-option"> 전체</label>
                <label><input type="radio" name="detail-option"> 당일</label>
                <label><input type="radio" name="detail-option"> 전일</label>
                <label><input type="radio" name="detail-option"> 당월</label>
                <label><input type="radio" name="detail-option"> 전월</label>
              </div>
            </div>
            <div class="details">
              <p>결제</p>
              <div class="radio-group">
                <label><input type="radio" name="detail-option"> 전체</label>
                <label><input type="radio" name="detail-option"> 카드</label>
                <label><input type="radio" name="detail-option"> 포인트</label>
              </div>
            </div>
            <div class="details">
              <p>상태</p>
              <div class="radio-group">
                <label><input type="radio" name="detail-option"> 전체</label>
                <label><input type="radio" name="detail-option"> 완료</label>
                <label><input type="radio" name="detail-option"> 환불</label>
              </div>
            </div>
            <div class="details">
              <p>매출 구분</p>
              <div class="radio-group">
                <label><input type="radio" name="detail-option"> 건별</label>
                <label><input type="radio" name="detail-option"> 상품별</label>
              </div>
            </div>
            <div class="flex">
              <p>연락처</p>
              <input type="text" name="" id="">
            </div>
          </div>
          
        </div>
      </section>

      <section>
        <div class="inner">
          <div class="boxStyle bl">            
            <div class="countArea">
              <div class="countbox mb10">
                  <p>총 매출</p>
                  <h4 data-target="87,000">0<small>원</small></h4>
              </div>
              <div class="countbox mb10">
                  <p>총 판매량</p>
                  <h4 data-target="87,000">00<small>원</small></h4>
              </div>
              <div class="countbox mb10">
                  <p>포인트 매출</p>
                  <h4 data-target="87,000">0<small>원</small></h4>
              </div>
              <div class="countbox">
                <p>포인트 결제건</p>
                <h4 data-target="240,000">00<small>원</small></h4>                  
              </div>
              
            </div>
            <button class="btn">엑셀다운로드</button>
          </div>
        </div>
      </section>
      

    </div>

  </body>
  <script defer type="text/javascript" src="../script/common.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

</html>
